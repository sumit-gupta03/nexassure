site_name: NexAssure
site_description: Open-source data testing and profiling for the modern warehouse, with a built-in MCP server.
site_url: https://sumit-gupta03.github.io/nexassure/
repo_url: https://github.com/sumit-gupta03/nexassure
repo_name: sumit-gupta03/nexassure
edit_uri: edit/main/docs/
copyright: Copyright &copy; 2026 Sumit Kumar Gupta and Nitish Pradhan - Apache License 2.0

theme:
  name: material
  icon:
    repo: fontawesome/brands/github
  features:
    - navigation.instant
    - navigation.tracking
    - navigation.sections
    - navigation.top
    - navigation.footer
    - content.code.copy
    - content.action.edit
    - search.suggest
    - search.highlight
    - toc.follow
  palette:
    # Follows the reader's system setting, with an explicit toggle either way.
    - media: "(prefers-color-scheme)"
      toggle:
        icon: material/brightness-auto
        name: Switch to light mode
    - media: "(prefers-color-scheme: light)"
      scheme: default
      primary: indigo
      accent: indigo
      toggle:
        icon: material/brightness-7
        name: Switch to dark mode
    - media: "(prefers-color-scheme: dark)"
      scheme: slate
      primary: indigo
      accent: indigo
      toggle:
        icon: material/brightness-4
        name: Switch to system preference

nav:
  - Home: index.md
  - Getting started: getting-started.md
  - Check reference: checks.md
  - Connectors: connectors.md
  - The metastore: metastore.md
  - MCP server: mcp.md
  - Architecture: architecture.md

markdown_extensions:
  - admonition
  - attr_list
  - def_list
  - footnotes
  - md_in_html
  - tables
  - toc:
      permalink: true
  - pymdownx.details
  - pymdownx.highlight:
      anchor_linenums: true
  - pymdownx.inlinehilite
  - pymdownx.snippets
  - pymdownx.superfences
  - pymdownx.tabbed:
      alternate_style: true

plugins:
  - search

# CONTRIBUTING.md and SECURITY.md live at the repo root, outside docs_dir, so
# links to them resolve on GitHub but not in the built site. Warn rather than
# fail the build.
validation:
  links:
    absolute_links: ignore
    unrecognized_links: warn

extra:
  social:
    - icon: fontawesome/brands/github
      link: https://github.com/sumit-gupta03/nexassure
    - icon: fontawesome/brands/python
      link: https://pypi.org/project/nexassure/
