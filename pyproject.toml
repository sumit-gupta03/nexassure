[build-system]
requires = ["hatchling>=1.21"]
build-backend = "hatchling.build"

[project]
name = "nexassure"
dynamic = ["version"]
description = "Open-source data testing and profiling framework for the modern warehouse - with a built-in MCP server."
readme = "README.md"
requires-python = ">=3.10"
license = "Apache-2.0"
license-files = ["LICENSE", "NOTICE"]
authors = [
  { name = "Sumit Kumar Gupta" },
  { name = "Nitish Pradhan" },
]
maintainers = [{ name = "Sumit Kumar Gupta" }]
keywords = [
  "data-testing", "data-quality", "data-profiling", "data-observability",
  "snowflake", "postgresql", "redshift", "synapse", "oracle", "sql-server",
  "mcp", "model-context-protocol", "etl", "elt", "great-expectations",
]
classifiers = [
  "Development Status :: 4 - Beta",
  "Intended Audience :: Developers",
  "Intended Audience :: Information Technology",
  "License :: OSI Approved :: Apache Software License",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.10",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Programming Language :: Python :: 3.13",
  "Topic :: Database",
  "Topic :: Software Development :: Quality Assurance",
  "Typing :: Typed",
]
dependencies = [
  "sqlalchemy>=2.0,<3.0",
  "pydantic>=2.6,<3.0",
  "pyyaml>=6.0",
  "typer>=0.12",
  "rich>=13.7",
  "jinja2>=3.1",
  "croniter>=2.0",
  "python-dotenv>=1.0",
]

[project.optional-dependencies]
postgres  = ["psycopg[binary]>=3.1"]
redshift  = ["redshift-connector>=2.1", "sqlalchemy-redshift>=0.8.14"]
snowflake = ["snowflake-sqlalchemy>=1.6", "snowflake-connector-python>=3.10"]
mssql     = ["pyodbc>=5.1"]
synapse   = ["pyodbc>=5.1"]
oracle    = ["oracledb>=2.2"]
mysql     = ["pymysql>=1.1"]
databricks = ["databricks-sqlalchemy>=1.0"]
bigquery  = ["sqlalchemy-bigquery>=1.11"]
duckdb    = ["duckdb>=1.0", "duckdb-engine>=0.13"]
mcp       = ["mcp>=1.2"]
server    = ["fastapi>=0.111", "uvicorn[standard]>=0.30"]
scheduler = ["apscheduler>=3.10,<4.0"]
notify    = ["httpx>=0.27"]
all = [
  "nexassure[postgres,redshift,snowflake,mssql,oracle,mysql,duckdb,mcp,server,scheduler,notify]",
]
docs = [
  "mkdocs>=1.6",
  "mkdocs-material>=9.5",
]
dev = [
  "pytest>=8.2", "pytest-cov>=5.0", "anyio>=4.4", "ruff>=0.5.0", "mypy>=1.10",
  "types-PyYAML", "duckdb>=1.0", "duckdb-engine>=0.13", "httpx>=0.27",
]

[project.urls]
Homepage      = "https://github.com/sumit-gupta03/nexassure"
Documentation = "https://github.com/sumit-gupta03/nexassure/tree/main/docs"
Repository    = "https://github.com/sumit-gupta03/nexassure"
Issues        = "https://github.com/sumit-gupta03/nexassure/issues"
Changelog     = "https://github.com/sumit-gupta03/nexassure/blob/main/CHANGELOG.md"

[project.scripts]
nexassure = "nexassure.cli:main"
nexassure-mcp = "nexassure.mcp.server:main"

[project.entry-points."nexassure.connectors"]
postgres   = "nexassure.connectors.postgres:PostgresConnector"
postgresql = "nexassure.connectors.postgres:PostgresConnector"
redshift   = "nexassure.connectors.redshift:RedshiftConnector"
snowflake  = "nexassure.connectors.snowflake:SnowflakeConnector"
mssql      = "nexassure.connectors.mssql:MSSQLConnector"
sqlserver  = "nexassure.connectors.mssql:MSSQLConnector"
synapse    = "nexassure.connectors.synapse:SynapseConnector"
oracle     = "nexassure.connectors.oracle:OracleConnector"
mysql      = "nexassure.connectors.mysql:MySQLConnector"
duckdb     = "nexassure.connectors.duckdb:DuckDBConnector"
sqlite     = "nexassure.connectors.sqlite:SQLiteConnector"

[project.entry-points."nexassure.checks"]
builtin = "nexassure.checks.builtin:register"

[tool.hatch.version]
path = "src/nexassure/version.py"

[tool.hatch.build.targets.wheel]
packages = ["src/nexassure"]

[tool.hatch.build.targets.sdist]
include = ["src/nexassure", "tests", "examples", "docs", "README.md", "LICENSE", "NOTICE"]

[tool.ruff]
line-length = 100
target-version = "py310"
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "N", "UP", "B", "C4", "SIM", "RUF"]
ignore = ["E501", "B008", "N818"]

[tool.ruff.lint.per-file-ignores]
# ConnectionError_ carries a trailing underscore on purpose: it must not shadow
# the builtin ConnectionError, and renaming it now would break the public API.
"src/nexassure/exceptions.py" = ["N801"]
"tests/*" = ["N802"]

[tool.mypy]
python_version = "3.10"
packages = ["nexassure"]
ignore_missing_imports = true
warn_unused_ignores = false
disallow_untyped_defs = false

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q --strict-markers"
markers = [
  "integration: requires a live database (deselect with '-m \"not integration\"')",
]
